description:
  en:
    genericName: "Video Editor"
    shortDescription: "Web-based video editor with AI-powered auto-captions and multi-track timeline."
    longDescription: >
      ReVideeo is a browser-based video editor with AI-powered auto-captions,
      multi-track timeline with free clip positioning, 12 transition types,
      keyboard shortcuts, and progressive web app support. Internationalized
      in Polish, English, and German. The render server for video export is
      maintained as a separate repository (revideeo-render-server).
  pl:
    genericName: "Edytor wideo"
    shortDescription: "Edytor wideo w przeglądarce z automatycznymi napisami AI i osią czasu."
    longDescription: >
      ReVideeo to edytor wideo w przeglądarce z automatycznymi napisami AI,
      osią czasu z wieloma ścieżkami i swobodnym pozycjonowaniem klipów,
      12 typami przejść, skrótami klawiszowymi i obsługą PWA. Zinternacjonalizowany
      w języku polskim, angielskim i niemieckim. Serwer renderujący do eksportu
      wideo jest utrzymywany w osobnym repozytorium (revideeo-render-server).
  de:
    genericName: "Video-Editor"
    shortDescription: "Browserbasierter Videoeditor mit KI-Untertiteln und Mehrspur-Zeitleiste."
    longDescription: >
      ReVideeo ist ein browserbasierter Videoeditor mit KI-gestützten
      automatischen Untertiteln, Mehrspur-Zeitleiste mit freier Clip-Positionierung,
      12 Übergangstypen, Tastenkürzeln und Progressive-Web-App-Unterstützung.
      Internationalisiert auf Polnisch, Englisch und Deutsch. Der Render-Server
      für den Video-Export wird in einem separaten Repository gepflegt
      (revideeo-render-server).


description:
  en: >-
    Web-based video editor with AI-powered auto-captions, multi-track timeline,
    transitions, and server-side rendering. Built with React 19, TypeScript,
    and a custom HTML5 preview engine. Licensed under EUPL-1.2.
  pl: >-
    Edytor wideo w przeglądarce z automatycznymi napisami AI, osią czasu z
    wieloma ścieżkami, przejściami i renderowaniem po stronie serwera. Zbudowany
    w React 19, TypeScript i natywnym rendererze HTML5. Licencja EUPL-1.2.
  de: >-
    Browserbasierter Videoeditor mit KI-gestützten automatischen Untertiteln,
    Mehrspur-Zeitleiste, Übergängen und serverseitigem Rendering. Entwickelt
    mit React 19, TypeScript und einer nativen HTML5-Vorschau-Engine. Lizenz: EUPL-1.2.


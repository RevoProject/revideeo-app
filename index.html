<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ReVideeo" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta property="og:title" content="ReVideeo — Open Source Video Editor" />
    <meta property="og:description" content="AI-powered open source video editor with timeline, plugins, and real-time preview." />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ReVideeo — Open Source Video Editor" />
    <meta name="twitter:description" content="AI-powered open source video editor with timeline, plugins, and real-time preview." />
    <meta name="twitter:image" content="/og-image.svg" />
    <title>ReVideeo</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #111214; color: #e5e7eb; }
      body { overflow: hidden; }
      #root { min-height: 100vh; }
      .boot-loader { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #111214; font-family: Inter, system-ui, sans-serif; }
      .boot-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; font-size: 30px; font-weight: 800; letter-spacing: -0.04em; }
      .boot-icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; background: #2563eb; color: white; font-size: 22px; }
      .boot-progress { width: 224px; height: 6px; overflow: hidden; border-radius: 999px; background: #2a2b30; }
      .boot-progress > span { display: block; width: 36%; height: 100%; border-radius: inherit; background: #3b82f6; animation: boot-progress 1s ease-in-out infinite; }
      .boot-label { margin-top: 12px; color: #6b7280; font-size: 12px; }
      @keyframes boot-progress { from { transform: translateX(-120%); } to { transform: translateX(320%); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" aria-label="Loading ReVideeo">
        <div class="boot-brand"><span class="boot-icon">R</span><span>Re<span style="color:#3b82f6">Videeo</span></span></div>
        <div class="boot-progress"><span></span></div>
        <div class="boot-label">Loading editor...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
